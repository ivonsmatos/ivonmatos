<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ivon Matos — Chief AI Officer · AI Engineering & Data Strategy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00010D"/>
      <stop offset="100%" stop-color="#0A0B14"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#C2926C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#C2926C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0%" stop-color="#C5D0D9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C5D0D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F2F2F2" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2926C"/>
      <stop offset="50%" stop-color="#C5D0D9"/>
      <stop offset="100%" stop-color="#C2926C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>

  <!-- Top eyebrow -->
  <g transform="translate(80, 80)">
    <circle cx="6" cy="6" r="4" fill="#16C784"/>
    <text x="20" y="11" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#C5D0D9" letter-spacing="2">
      CHIEF AI OFFICER · SÃO PAULO, BRASIL
    </text>
  </g>

  <!-- Main title -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="Georgia, 'Fraunces', serif" font-size="84" font-weight="500" fill="#F2F2F2" letter-spacing="-3">
      Ivon Matos
    </text>
    <text x="0" y="90" font-family="Georgia, 'Fraunces', serif" font-size="44" font-weight="400" fill="#C5D0D9" letter-spacing="-1">
      Construindo
    </text>
    <text x="220" y="90" font-family="Georgia, 'Fraunces', serif" font-style="italic" font-size="44" font-weight="400" fill="url(#shimmer)" letter-spacing="-1">
      ecossistemas de IA
    </text>
    <text x="0" y="145" font-family="Georgia, 'Fraunces', serif" font-size="44" font-weight="400" fill="#C5D0D9" letter-spacing="-1">
      que vão além do hype.
    </text>
  </g>

  <!-- Pillars -->
  <g transform="translate(80, 470)" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#C2926C" letter-spacing="2">
    <text x="0"   y="0">AI ENGINEERING</text>
    <text x="220" y="0">· AGENTES AUTÔNOMOS</text>
    <text x="510" y="0">· SISTEMAS RAG</text>
    <text x="720" y="0">· DATA STRATEGY</text>
  </g>

  <!-- Bottom signature -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="60" height="2" fill="#C2926C"/>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#F2F2F2">
      ivonmatos.com.br
    </text>
  </g>

  <!-- Logo mark top-right -->
  <g transform="translate(1040, 60)">
    <rect width="80" height="80" rx="18" fill="#00010D" stroke="#C2926C" stroke-opacity="0.4"/>
    <text x="40" y="55" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="700" fill="#C2926C" text-anchor="middle">IM</text>
  </g>
</svg>
